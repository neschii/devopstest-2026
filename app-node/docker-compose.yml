version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  app-node:
    build:
      context: ./app-node
      dockerfile: Dockerfile
    container_name: app_node
    restart: always
    ports:
      - "${NODE_PORT:-8002}:${NODE_PORT:-8002}"
    environment:
      - NODE_PORT=${NODE_PORT:-8002}
      - NODE_CACHE_TTL=${NODE_CACHE_TTL:-60}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - redis
    networks:
      - app_network

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge